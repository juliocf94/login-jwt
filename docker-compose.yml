# Oracle 23 Free en Docker.
#   docker compose up -d        -> levanta Oracle (la 1a vez tarda 1-3 min y ejecuta db/*.sql)
#   docker compose ps           -> esperar a que diga (healthy)
#   docker compose down -v      -> borra contenedor Y datos (vuelve a ejecutar los scripts al subir)
#
# Si en la prueba ya te dan un Oracle dockerizado, NO uses este archivo:
# solo cambia url/usuario/clave en application.properties de tu backend.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-login
    ports:
      - "1521:1521"            # si el 1521 está ocupado por otro Oracle, deténlo o usa "1522:1521"
    environment:
      ORACLE_PASSWORD: admin123  # clave de SYS / SYSTEM
      APP_USER: app              # usuario de la app, se crea en FREEPDB1
      APP_USER_PASSWORD: app123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-data:
