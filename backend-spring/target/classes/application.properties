# =====================================================================
#  Backend SPRING BOOT  ->  http://localhost:8080
#  Swagger UI           ->  http://localhost:8080/swagger-ui.html
# =====================================================================
spring.application.name=backend-spring
server.port=8080

# ---------- Oracle (cambiar aquí si en la prueba te dan otros datos) ----------
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=app
spring.datasource.password=app123

# none = Hibernate no crea ni modifica tablas (las crea db/01_schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT (HS256 = una sola clave secreta para firmar y verificar) ----------
# Mínimo 32 caracteres. En producción iría en una variable de entorno, no en el código.
app.jwt.secret=clave-secreta-de-la-prueba-tecnica-cambiar-123456
app.jwt.issuer=login-jwt
app.jwt.duracion-segundos=3600

# ---------- CORS ----------
app.cors.origen=http://localhost:4200
