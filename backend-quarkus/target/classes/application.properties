# =====================================================================
#  Backend QUARKUS  ->  http://localhost:8081
#  Swagger UI       ->  http://localhost:8081/q/swagger-ui
# =====================================================================
quarkus.http.port=8081

# ---------- Oracle (cambiar aquí si en la prueba te dan otros datos) ----------
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
quarkus.datasource.username=app
quarkus.datasource.password=app123
# Sin esto, en modo dev Quarkus intenta levantar SU PROPIO Oracle en Docker
quarkus.devservices.enabled=false

# none = Hibernate no crea ni modifica tablas (las crea db/01_schema.sql)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true

# ---------- JWT ----------
# El login FIRMA el token con la clave privada; cada petición se VERIFICA con la pública.
# (Par de llaves RSA de prueba en src/main/resources. En producción irían en un secreto.)
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=login-jwt
# Duración del token en segundos (usada por AuthResource)
app.jwt.duracion-segundos=3600

# ---------- CORS para Angular ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200

# ---------- Swagger: botón "Authorize" para pegar el token ----------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt
